name: test

# 每次推送 / PR 都跑一遍测试；release.yml 打包前也复用这一份（workflow_call），测试不过就不打包
on:
  push:
    branches: ['**']  # tag 推送由 release.yml 复用本文件跑，这里不重复跑
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest  # UI 自动化 / Windows API 只能在 Windows 上测
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # 跟 constraints.txt 冻结时的解释器一致；rapidocr 1.4 要求 < 3.13
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: 装依赖（版本按 constraints.txt 钉死）
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: 依赖自洽检查
        run: pip check

      - name: 测试
        # tests/conftest.py 已把配置目录、密钥、注册表、网络隔离；这里不需要任何真实 key
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=10
